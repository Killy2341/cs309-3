<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary-color);
        }
        
        input.invalid {
            border-color: var(--error-color);
        }
        /* hidden by default, shown via js */
        .error-msg {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none; 
        }
        .error-msg.active {
            display: block;
        }
        .success-msg {
            color: var(--success-color);
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Create an Account</h1>

        <!-- novalidate disables browser default validation so js takes over -->
        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="John Doe" autocomplete="name">
                <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com" autocomplete="email">
                <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password">
                <span class="error-msg" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password">
                <span class="error-msg" id="confirmPasswordError"></span>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Must be 18 or older" autocomplete="off">
                <span class="error-msg" id="ageError"></span>
            </div>

            <button type="submit">Register</button>
            <div class="success-msg" id="successMessage">Registration Successful!</div>
        </form>
    </div>

    <script src="js/validation.js"></script>
</body>
</html>
