<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* override the max-width from style.css so the table can be wider */
        .container {
            max-width: 800px; 
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            /* flex-wrap: wrap; allows wrapping on small screens */
        }

        #searchInput {
            flex: 1; /* takes up remaining space */
            min-width: 200px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        #searchInput:focus {
            border-color: var(--primary-color);
        }

        .sort-buttons {
            display: flex;
            gap: 10px;
        }

        /* override the 100% width button style just for these sort buttons */
        .sort-buttons button {
            width: auto; 
            padding: 10px 15px;
            font-size: 14px;
        }

        /* --- table style --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-color);
            font-weight: 600;
        }

        /* striped rows for readability */
        tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }
        
        tbody tr:hover {
            background-color: #f3f4f6;
        }

        #noResults {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Employee Directory</h1>

        <div class="controls">
            <!-- search box -->
            <input type="text" id="searchInput" placeholder="Search by name or city...">

            <!-- sort buttons -->
            <div class="sort-buttons">
                <button type="button" id="sortByName">Sort by Name</button>
                <button type="button" id="sortByAge">Sort by Age</button>
            </div>
        </div>

        <!-- the table -->
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- rows will be generated here by js -->
            </tbody>
        </table>

        <!-- show this if the search finds nothing -->
        <div id="noResults">No records found matching your search.</div>
    </div>

    <script src="js/table.js"></script>
</body>
</html>
